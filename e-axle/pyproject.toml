requires-python = ">=3.11,<3.15"
dependencies = [
    "instro>=1.16.0",
    "instro-unstable>=1.10.0",
    "python-can>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
