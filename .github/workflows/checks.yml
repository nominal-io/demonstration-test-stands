name: Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Filter paths
      id: filter
      uses: dorny/paths-filter@v4
      with:
        filters: |
          e-axle:
            - 'e-axle/**'
            - '.github/workflows/checks.yml'
          fluids:
            - 'fluids/**'
            - '.github/workflows/checks.yml'

  test:
    name: ${{ matrix.app }} on Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
        python-version: ['3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: ${{ matrix.app }}/uv.lock

    - name: Set up just
      uses: extractions/setup-just@v3

    - name: Install dependencies
      run: uv sync --locked

    - name: Lint, format, and type checks
      run: |
        just lint --output-format=github
        just format --check --diff
        just check

    - name: Run tests with pytest
      run: just test -v

  checks-passed:
    name: Checks passed
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any check failed or was cancelled
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
