name: E-Axle Checks

on:
  push:
    branches:
      - main
    paths:
      - 'e-axle/**'
  pull_request:
    paths:
      - 'e-axle/**'

jobs:
  test:
    name: E-Axle Checks on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e-axle

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: e-axle/uv.lock

    - name: Set up just
      uses: extractions/setup-just@v3

    - name: Install dependencies
      run: uv sync --locked

    - name: Lint, format, and type checks
      run: |
        just lint --output-format=github
        just format --check --diff
        just check

    - name: Run tests with pytest
      run: just test -v
