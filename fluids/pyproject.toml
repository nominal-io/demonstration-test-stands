[project]
name = "fluids-panel"
version = "0.1.0"
description = "Control software for the fluids panel test stand"
readme = "README.md"
authors = [{ name = "Mick Harrigan", email = "michael.harrigan@fslabs.ca" }]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "check" },
]
test = ["pytest>=9.1.1"]
lint = ["ruff>=0.16.8"]
check = ["ty>=0.0.81"]
